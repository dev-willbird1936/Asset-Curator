function update(dt,t){

  if(S.invuln>0)S.invuln-=dt;else if(dist(S.player,S.enemy)<CONV.hitR)hurt();
 }else heroMoving=false;

 if(heroRig){heroRig.set(heroMoving);heroRig.mixer.update(dt);}

 if(!enemyRig)enemyFb.position.y=S.phase==='playing'?Math.abs(Math.sin(t*8))*.06:0;

  v.f.sp.visible=!c.collected&&real;v.f.sp.position.set(c.x,y,c.z);v.g.visible=!c.collected&&!real;v.g.position.set(c.x,y,c.z);v.g.rotation.y=t*3;});

 for(const b of bursts){if(!b.on)continue;b.age+=dt;const real=b.f.frame(b.age*24);
  if(real){if(b.age*24>=burstSheet.cols*burstSheet.rows){b.on=false;b.f.sp.visible=false;}else b.f.sp.scale.set(1.5,1.5,1);}
  else{const k=b.age/.6;b.f.sp.scale.setScalar(.3+1.3*k);b.f.mat.opacity=1-k;if(k>=1){b.on=false;b.f.sp.visible=false;b.f.mat.opacity=1;}}}
 const target=S.door.open?-1.6:0;doorAng+=(target-doorAng)*Math.min(1,dt*3);doorPivot.rotation.y=doorAng;

}

function groundingList(){const out=[],add=(name,obj,x,z)=>{const b=worldBox(obj);out.push({name,x:+x.toFixed(3),z:+z.toFixed(3),bottomY:b.isEmpty()?null:+b.min.y.toFixed(3),groundY:groundHeight(x,z)});};
 add('hero',heroRoot,S.player.x,S.player.z);add('enemy',enemyRoot,S.enemy.x,S.enemy.z);propGroups.forEach(e=>add(e.p.name,e.g,e.p.x,e.p.z));add('door',doorPivot,0,-6);return out;}
const r3=v=>+v.toFixed(3);
window.gameDebug=Object.freeze({snapshot(){const p=S.player;return{phase:S.phase,player:{x:r3(p.x),y:r3(p.y),z:r3(p.z)},spawn:{...SPAWN},
 coins:S.coins.map(c=>({id:c.id,x:c.x,z:c.z,collected:c.collected})),key:{x:S.key.x,z:S.key.z,collected:S.key.collected},door:{x:S.door.x,z:S.door.z,open:S.door.open},
 enemy:{x:r3(S.enemy.x),z:r3(S.enemy.z)},hearts:S.hearts,collectedCoins:nCoins(),remainingSeconds:r3(remaining()),
 colliders:colliders.map(c=>({name:c.name,minX:c.minX,maxX:c.maxX,minZ:c.minZ,maxZ:c.maxZ})),grounding:groundingList(),assetUses:uses.map(u=>({...u}))};}});
