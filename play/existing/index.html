const sound={on:false};let actx=null,master=null,musicBus=null,musicOn=false,musicTimer=0,drones=[],mstep=0;
const SFX={};

function ensureCtx(){
 if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;actx=new AC();master=actx.createGain();master.gain.value=0.8;master.connect(actx.destination);
  musicBus=actx.createGain();musicBus.gain.value=0;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;musicBus.connect(lp);lp.connect(master);
  const dl=actx.createDelay(1.5);dl.delayTime.value=0.52;const fb=actx.createGain();fb.gain.value=0.38;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(master);}
 if(actx.state==='suspended')actx.resume();return actx;
}
function tone(f0,f1,dur,type='sine',vol=0.25,delay=0){
 const c=ensureCtx();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function fallbackSfx(n){
 if(n==='coin'){tone(880,1000,0.12,'sine',.25);tone(1320,1400,0.2,'sine',.22,0.08);}
 else if(n==='key'){tone(660,700,.12,'triangle',.25);tone(990,1000,.12,'triangle',.25,.1);tone(1320,1340,.25,'triangle',.25,.2);}
 else if(n==='door'){tone(90,45,1.4,'sawtooth',.2);tone(60,40,1.6,'square',.12,.1);}
 else tone(180,50,0.28,'square',.25);
}

 if(s&&s.u.loaded){try{const a=s.a.cloneNode();a.volume=n==='door'?0.9:0.7;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>fallbackSfx(n));if(n==='hit')setTimeout(()=>{try{a.pause();}catch(e){}},700);}catch(e){fallbackSfx(n);}}
 else fallbackSfx(n);
}
const SCALE=[0,3,5,7,10,12,15,17];
const PATTERN=[0,-1,2,-1,4,-1,3,-1,5,-1,2,-1,1,-1,-1,-1,0,-1,3,-1,4,-1,6,-1,4,-1,2,-1,1,-1,-1,-1];
function musicTick(){
 if(!actx||!musicOn)return;const t=actx.currentTime;
 const d=PATTERN[mstep%PATTERN.length];
 if(d>=0){const f=110*Math.pow(2,SCALE[d]/12)*2;const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.16,t+0.06);g.gain.exponentialRampToValueAtTime(0.001,t+2.2);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+2.3);}
 if(mstep%16===0){for(const semi of [0,7,12]){const f=55*Math.pow(2,semi/12);const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.12,t+2);g.gain.linearRampToValueAtTime(0,t+10);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+10.2);}}
 mstep++;
}
function startMusic(){const c=ensureCtx();if(!c||musicOn)return;musicOn=true;musicBus.gain.cancelScheduledValues(c.currentTime);musicBus.gain.setTargetAtTime(0.9,c.currentTime,0.6);mstep=0;musicTick();musicTimer=setInterval(musicTick,650);}
function stopMusic(){if(!musicOn)return;musicOn=false;clearInterval(musicTimer);if(actx)musicBus.gain.setTargetAtTime(0,actx.currentTime,0.25);}

/* ---------- physics ---------- */
function resolve(p,r){
 const R=CONV.room;
 for(let it=0;it<3;it++){
  for(const c of colliders){
   const cx=clamp(p.x,c.minX,c.maxX),cz=clamp(p.z,c.minZ,c.maxZ);const dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;if(d2>=r*r)continue;
   if(d2>1e-9){const d=Math.sqrt(d2),k=(r-d)/d;p.x+=dx*k;p.z+=dz*k;}
   else{const l=p.x-c.minX,rr=c.maxX-p.x,t=p.z-c.minZ,b=c.maxZ-p.z,m=Math.min(l,rr,t,b);
    if(m===l)p.x=c.minX-r;else if(m===rr)p.x=c.maxX+r;else if(m===t)p.z=c.minZ-r;else p.z=c.maxZ+r;}
  }
  p.x=clamp(p.x,R.minX+r,R.maxX-r);p.z=clamp(p.z,R.minZ+r,R.maxZ-r);
 }
}
function turn(cur,target,k){let d=target-cur;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return cur+d*k;}

/* ---------- main loop ---------- */
let last=performance.now(),T=0;
function frame(now){
 const real=Math.min(1,(now-last)/1000);last=now;const dt=Math.min(0.05,real);T+=dt;
 update(dt,real);renderer.render(scene,camera);requestAnimationFrame(frame);
}
function update(dt,real){
 let hint='';
 if(S.phase==='playing'){
  S.time-=real;S.elapsed+=real;
  let vx=(keys.right?1:0)-(keys.left?1:0),vz=(keys.down?1:0)-(keys.up?1:0);const len=Math.hypot(vx,vz);
  hero.moving=len>0;
  const p={x:hero.x,z:hero.z};
  if(len>0){vx/=len;vz/=len;p.x+=vx*CONV.heroSpeed*dt;p.z+=vz*CONV.heroSpeed*dt;hero.yaw=turn(hero.yaw,Math.atan2(vx,vz),Math.min(1,dt*14));}
  if(Math.abs(S.knx)+Math.abs(S.knz)>0.05){p.x+=S.knx*dt;p.z+=S.knz*dt;const k=Math.exp(-8*dt);S.knx*=k;S.knz*=k;}
  resolve(p,CONV.heroRadius);hero.x=p.x;hero.z=p.z;
  stepGuard(dt);guard.moving=true;
  if(S.invuln>0)S.invuln-=dt;
  const dg=Math.hypot(hero.x-guard.x,hero.z-guard.z);
  if(dg<CONV.hitRange&&S.invuln<=0){
   S.hearts--;S.invuln=CONV.invuln;const nx=(hero.x-guard.x)||0.001,nz=(hero.z-guard.z)||0.001,nl=Math.hypot(nx,nz);S.knx=nx/nl*10;S.knz=nz/nl*10;
   playSfx('hit');$('flash').style.opacity='1';setTimeout(()=>{$('flash').style.opacity='0';},180);toast('Ouch!');
   if(S.hearts<=0){S.hearts=0;S.endReason='hit';setPhase('lost');}
  }
  if(S.phase==='playing'&&S.time<=0){S.time=0;S.endReason='time';setPhase('lost');}
  hero.g.visible=S.invuln>0?(Math.floor(T*14)%2===0):true;
  // contextual hint
  let near=null,nd=CONV.pickupRange;
  for(const c of coinData){if(!c.collected){const d=Math.hypot(hero.x-c.x,hero.z-c.z);if(d<=nd){nd=d;near='coin';}}}
  if(!keyData.collected){const d=Math.hypot(hero.x-keyData.x,hero.z-keyData.z);if(d<=nd){nd=d;near='key';}}
  const dd=Math.hypot(hero.x-door.x,hero.z-door.z);
  if(near)hint=keyLabel+' \u2014 take the '+near;
  else if(dd<=CONV.doorRange)hint=(S.hasKey&&S.collectedCoins===3)?keyLabel+' \u2014 open the gate':'The gate is locked: you need the key and all 3 coins';
  else hint=coarse?'Use the pad to move':'WASD / arrows to move \u00B7 E to interact';
 }else{hero.moving=false;guard.moving=false;if(S.phase!=='playing')hero.g.visible=true;}

 // entity transforms & animation
 for(const e of [hero,guard]){
  e.g.position.set(e.x,groundHeight(e.x,e.z),e.z);e.g.rotation.y=e.yaw;e.shadow.position.set(e.x,groundHeight(e.x,e.z)+0.02,e.z);
  if(e.mixer){setAnim(e,e.moving?'walk':'idle');e.mixer.update(dt);}
  else e.holder.position.y=e.moving?Math.abs(Math.sin(T*10))*0.06:0;
 }
 hero.shadow.visible=hero.g.visible;
 // pickups
 for(const c of coinData){if(c.collected)continue;c.holder.position.set(c.x,groundHeight(c.x,c.z)+PICK_Y+Math.sin(T*2.4+c.x)*0.1,c.z);c.mesh.rotation.y=T*2.2;
  const near=S.phase==='playing'&&Math.hypot(hero.x-c.x,hero.z-c.z)<=CONV.pickupRange;c.holder.scale.setScalar(near?1.25:1);c.glow.material.opacity=0.4+0.2*Math.sin(T*4+c.z);}
 if(!keyData.collected){keyData.holder.position.set(keyData.x,groundHeight(keyData.x,keyData.z)+PICK_Y+Math.sin(T*2.1)*0.12,keyData.z);keyData.mesh.rotation.y=T*1.8;
  const near=S.phase==='playing'&&Math.hypot(hero.x-keyData.x,hero.z-keyData.z)<=CONV.pickupRange;keyData.holder.scale.setScalar(near?1.25:1);keyData.glow.material.opacity=0.45+0.2*Math.sin(T*3.5);}
 // torches
 for(const t of torches){const f=0.8+0.2*Math.sin(T*9+t.ph)+0.12*Math.sin(T*23+t.ph*2.3)+(Math.random()-0.5)*0.08;t.L.intensity=t.base*f;
  t.fl.forEach((s,j)=>{const sc=[0.85,0.55,0.28][j]*(0.9+0.25*Math.sin(T*(12+j*3)+t.ph));s.scale.set(sc*0.8,sc*1.3,1);s.position.y=0.5+j*0.06+0.03*Math.sin(T*15+t.ph+j);});}
 // particles
 for(const p of particles){if(p.life<=0)continue;p.life-=dt;if(p.life<=0){p.s.visible=false;continue;}p.vy-=6*dt;p.s.position.x+=p.vx*dt;p.s.position.y+=p.vy*dt;p.s.position.z+=p.vz*dt;const k=p.life/p.max;p.s.material.opacity=k;p.s.scale.setScalar(0.12+0.3*k);}
 // gate
 if(door.open&&doorT<1)doorT=Math.min(1,doorT+dt/1.6);else if(!door.open)doorT=0;
 const e=1-Math.pow(1-doorT,3);panelL.rotation.y=-1.75*e;panelR.rotation.y=1.75*e;
 portalGlow.material.opacity=0.85*e*(0.85+0.15*Math.sin(T*3));portalSwirl.material.opacity=0.9*e;portalSwirl.material.rotation=T*0.8;doorLight.intensity=60*e*(0.9+0.1*Math.sin(T*5));
 updateHud(hint);
}

/* ---------- debug surface (read-only) ---------- */
function bottomOf(o){return new THREE.Box3().setFromObject(o).min.y;}
window.gameDebug={snapshot(){
 const g=[{name:'hero',x:hero.x,z:hero.z,bottomY:bottomOf(hero.g),groundY:groundHeight(hero.x,hero.z)},{name:'enemy',x:guard.x,z:guard.z,bottomY:bottomOf(guard.g),groundY:groundHeight(guard.x,guard.z)},
  {name:'door',x:door.x,z:door.z,bottomY:bottomOf(doorG),groundY:groundHeight(door.x,door.z)}];
 for(const p of PROPS)g.push({name:p.name,x:p.x,z:p.z,bottomY:bottomOf(p.wrap),groundY:groundHeight(p.x,p.z)});
 return JSON.parse(JSON.stringify({
  phase:S.phase,player:{x:hero.x,y:hero.g.position.y,z:hero.z},spawn:SPAWN,
  coins:coinData.map(c=>({id:c.id,x:c.x,z:c.z,collected:c.collected})),
  key:{x:keyData.x,z:keyData.z,collected:keyData.collected},door:{x:door.x,z:door.z,open:door.open},
  enemy:{x:guard.x,z:guard.z},hearts:S.hearts,collectedCoins:S.collectedCoins,remainingSeconds:S.time,
  colliders:colliders.map(c=>({name:c.name,minX:c.minX,maxX:c.maxX,minZ:c.minZ,maxZ:c.maxZ})),
  grounding:g,assetUses:uses.map(u=>({slot:u.slot,kind:u.kind,path:u.path,loaded:u.loaded,fallback:!u.loaded}))
 }));
}};

resetWorld();placeGuard();setPhase('title');requestAnimationFrame(frame);
</script>
